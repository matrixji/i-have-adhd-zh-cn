name: Validate simplified Chinese skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check repository contracts
        run: python3 scripts/check_repo.py
      - name: Run unit tests without model calls
        run: python3 -m unittest discover -s tests -v
      - name: Validate single-turn evaluation cases
        run: python3 scripts/run_evals.py validate
      - name: Validate persistence scenario
        run: python3 scripts/run_scenario_eval.py validate evals/scenarios/persistence-topic-switch-stop
      - name: Check whitespace
        run: git diff --check
